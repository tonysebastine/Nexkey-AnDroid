name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        cache: 'gradle'  # NEW: Enable gradle caching

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Make gradlew executable
      run: chmod +x ./gradlew  # NEW: Ensure wrapper is executable

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace  # FIXED: Use wrapper instead of raw gradle

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      if: success()  # NEW: Only upload on success
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
